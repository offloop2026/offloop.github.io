backend:
  name: github
  repo: glassgkim/offloop2026.github.io
  branch: main
  auth_type: implicit

media_folder: "assets/images"
public_folder: "/assets/images"

collections:
  - name: "photo"
    label: "사진 아카이브"
    folder: "content/photos"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "제목", name: "title", widget: "string"}
      - {label: "날짜", name: "date", widget: "datetime"}
      - {label: "카테고리", name: "category", widget: "select", options: ["눈자리나게", "풍경", "일상"]}
      - {label: "사진 업로드", name: "image", widget: "image"}
      - {label: "설명", name: "desc", widget: "text"}
