<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photo & Exhibition Archive</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0b0c0e;
      --card-bg: #14161a;
      --card-border: rgba(255, 255, 255, 0.08);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --accent-badge: #1f232b;
      --overlay-bg: rgba(11, 12, 14, 0.94);
      --transition-smooth: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    [data-theme="light"] {
      --bg-color: #f7f8fa;
      --card-bg: #ffffff;
      --card-border: rgba(0, 0, 0, 0.08);
      --text-main: #111827;
      --text-muted: #6b7280;
      --accent-badge: #f0f1f5;
      --overlay-bg: rgba(247, 248, 250, 0.94);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      transition: background-color 0.3s, color 0.3s;
    }

    .container { max-width: 1400px; margin: 0 auto; padding: 0 2rem; }

    /* Navigation Header */
    header {
      position: sticky; top: 0; z-index: 100;
      background-color: rgba(11, 12, 14, 0.85);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--card-border);
    }
    [data-theme="light"] header { background-color: rgba(247, 248, 250, 0.85); }

    .nav-wrapper {
      display: flex; justify-content: space-between; align-items: center; height: 80px;
    }

    .brand-logo {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.4rem; font-weight: 700; text-decoration: none; color: var(--text-main);
    }

    .nav-links { display: flex; gap: 2rem; list-style: none; }
    .nav-link-btn {
      background: none; border: none; color: var(--text-muted);
      font-size: 1rem; font-weight: 600; cursor: pointer; transition: var(--transition-smooth);
    }
    .nav-link-btn:hover, .nav-link-btn.active { color: var(--text-main); }

    .theme-toggle-btn {
      background: var(--accent-badge); border: 1px solid var(--card-border);
      color: var(--text-main); width: 40px; height: 40px; border-radius: 50%;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
    }

    /* Page Views */
    .page-section { display: none; padding: 3rem 0; }
    .page-section.active { display: block; }

    /* Masonry Grid (사진 크기에 맞게 세로 자동 변경) */
    .masonry-grid {
      column-count: 3;
      column-gap: 1.5rem;
    }

    .masonry-item {
      break-inside: avoid;
      margin-bottom: 1.5rem;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      overflow: hidden;
      cursor: pointer;
      transition: var(--transition-smooth);
    }

    .masonry-item:hover {
      transform: translateY(-6px);
      border-color: rgba(255, 255, 255, 0.3);
    }

    .masonry-item img {
      width: 100%;
      height: auto; /* 이미지 원본 비율에 맞춰 높이 자동 조정 */
      display: block;
    }

    .item-info { padding: 1.25rem; }
    .item-title { font-family: 'Space Grotesk', sans-serif; font-size: 1.2rem; font-weight: 700; margin-bottom: 0.5rem; }
    .item-desc { font-size: 0.9rem; color: var(--text-muted); }

    /* Filter Buttons */
    .filter-bar { display: flex; gap: 10px; margin-bottom: 2rem; flex-wrap: wrap; }
    .filter-btn {
      background: transparent; border: 1px solid var(--card-border);
      color: var(--text-muted); padding: 8px 18px; border-radius: 30px;
      font-weight: 600; cursor: pointer; transition: var(--transition-smooth);
    }
    .filter-btn.active, .filter-btn:hover {
      background: var(--text-main); color: var(--bg-color); border-color: var(--text-main);
    }

    /* About Page Style */
    .about-box {
      max-width: 800px; margin: 0 auto; padding: 3rem 0; line-height: 1.8;
    }
    .about-box h1 { font-family: 'Space Grotesk', sans-serif; font-size: 2.5rem; margin-bottom: 1.5rem; }

    /* Modal */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: var(--overlay-bg); z-index: 1000; opacity: 0; pointer-events: none;
      display: flex; align-items: center; justify-content: center; padding: 2rem;
      transition: opacity 0.3s;
    }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .modal-card {
      background: var(--card-bg); border: 1px solid var(--card-border);
      border-radius: 20px; max-width: 900px; width: 100%; max-height: 90vh;
      overflow-y: auto; padding: 2rem; position: relative;
    }
    .modal-card img { width: 100%; height: auto; border-radius: 12px; margin-bottom: 1.5rem; }

    @media (max-width: 900px) { .masonry-grid { column-count: 2; } }
    @media (max-width: 600px) { .masonry-grid { column-count: 1; } }
  </style>
</head>
<body data-theme="dark">

  <header>
    <div class="container nav-wrapper">
      <a href="#" class="brand-logo">MAXFOLIO</a>
      <ul class="nav-links">
        <li><button class="nav-link-btn active" onclick="switchPage('archive')">아카이브</button></li>
        <li><button class="nav-link-btn" onclick="switchPage('exhibition')">전시</button></li>
        <li><button class="nav-link-btn" onclick="switchPage('about')">소개</button></li>
      </ul>
      <button class="theme-toggle-btn" id="themeToggle">🌓</button>
    </div>
  </header>

  <main class="container">
    <!-- 아카이브 페이지 -->
    <section id="archive" class="page-section active">
      <div class="filter-bar">
        <button class="filter-btn active" onclick="filterArchive('all')">전체</button>
        <button class="filter-btn" onclick="filterArchive('눈자리나게')">눈자리나게</button>
        <button class="filter-btn" onclick="filterArchive('풍경')">풍경</button>
        <button class="filter-btn" onclick="filterArchive('일상')">일상</button>
      </div>
      <div class="masonry-grid" id="archiveGrid"></div>
    </section>

    <!-- 전시 페이지 -->
    <section id="exhibition" class="page-section">
      <div class="masonry-grid" id="exhibitionGrid"></div>
    </section>

    <!-- 소개 페이지 (단독 페이지) -->
    <section id="about" class="page-section">
      <div class="about-box">
        <h1>About the Archive</h1>
        <p>시선과 기록을 아카이빙하는 공간입니다. 사진의 비율과 스토리를 왜곡 없이 담아내기 위해 미니멀한 모노톤 갤러리로 구성되었습니다.</p>
      </div>
    </section>
  </main>

  <!-- 이미지 모달 창 -->
  <div class="modal-overlay" id="modalOverlay" onclick="closeModal()">
    <div class="modal-card" onclick="event.stopPropagation()">
      <img id="modalImg" src="" alt="">
      <h2 id="modalTitle" class="item-title"></h2>
      <p id="modalDesc" class="item-desc"></p>
    </div>
  </div>

  <script>
    // 아카이브 및 전시 데이터 샘플
    const archiveData = [
      { id: 1, title: "눈자리나게 - 첫 번째 기록", category: "눈자리나게", image: "https://images.unsplash.com/photo-1513694203232-719a280e022f?w=800&q=80", desc: "세로가 긴 사진 예시" },
      { id: 2, title: "고요한 아침", category: "풍경", image: "https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=800&q=80", desc: "가로가 긴 사진 예시" },
      { id: 3, title: "눈자리나게 - 겨울의 여운", category: "눈자리나게", image: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=800&q=80", desc: "인물 세로 사진 예시" }
    ];

    const exhibitionData = [
      { id: 101, title: "2026 특별 전시회", image: "https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?w=800&q=80", desc: "전시회 작품 기록" }
    ];

    // 페이지 전환
    function switchPage(pageId) {
      document.querySelectorAll('.page-section').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-link-btn').forEach(el => el.classList.remove('active'));
      
      document.getElementById(pageId).classList.add('active');
      event.target.classList.add('active');
    }

    // 아카이브 렌더링
    function renderArchive(filter = 'all') {
      const grid = document.getElementById('archiveGrid');
      grid.innerHTML = '';
      
      const filtered = filter === 'all' ? archiveData : archiveData.filter(i => i.category === filter);
      filtered.forEach(item => {
        grid.innerHTML += `
          <div class="masonry-item" onclick="openModal('${item.image}', '${item.title}', '${item.desc}')">
            <img src="${item.image}" alt="${item.title}">
            <div class="item-info">
              <div class="item-title">${item.title}</div>
              <div class="item-desc">${item.desc}</div>
            </div>
          </div>
        `;
      });
    }

    // 전시 렌더링
    function renderExhibition() {
      const grid = document.getElementById('exhibitionGrid');
      grid.innerHTML = '';
      exhibitionData.forEach(item => {
        grid.innerHTML += `
          <div class="masonry-item" onclick="openModal('${item.image}', '${item.title}', '${item.desc}')">
            <img src="${item.image}" alt="${item.title}">
            <div class="item-info">
              <div class="item-title">${item.title}</div>
              <div class="item-desc">${item.desc}</div>
            </div>
          </div>
        `;
      });
    }

    function filterArchive(cat) {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
      renderArchive(cat);
    }

    // 모달
    function openModal(img, title, desc) {
      document.getElementById('modalImg').src = img;
      document.getElementById('modalTitle').textContent = title;
      document.getElementById('modalDesc').textContent = desc;
      document.getElementById('modalOverlay').classList.add('active');
    }
    function closeModal() { document.getElementById('modalOverlay').classList.remove('active'); }

    // 다크모드 토글
    document.getElementById('themeToggle').onclick = () => {
      const theme = document.body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      document.body.setAttribute('data-theme', theme);
    };

    // 초기화
    renderArchive();
    renderExhibition();
  </script>
</body>
</html>
